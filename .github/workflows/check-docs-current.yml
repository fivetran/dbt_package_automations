name: Check docs current

on:
  workflow_call:

permissions:
  contents: write

jobs:
  scaffold-changes-template:
    # Runs once, when the PR is first opened, to drop a copy-paste-ready
    # .changes/*.yml template into the branch. Skipped for fork PRs.
    if: >-
      github.event.action == 'opened' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout PR branch
        run: |
          git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          git pull --rebase origin "$BRANCH_NAME"
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}

      - name: Skip if a changes entry or template already exists
        id: existing
        run: |
          if ls .changes/*.yml >/dev/null 2>&1 || [ -f ".changes/TODO.yml.template" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download changes-template.yml
        if: steps.existing.outputs.skip == 'false'
        # Hardcoded to the changelog POC test branch for now (see GA-1035597).
        # Update this ref once that work lands on main.
        run: |
          mkdir -p .changes
          curl -sSfL \
            "https://raw.githubusercontent.com/fivetran/dbt_package_automations/refs/heads/changelog-poc/initial-test/templates/changes-template.yml" \
            -o .changes/TODO.yml.template

      - name: Commit and push the template
        if: steps.existing.outputs.skip == 'false'
        run: |
          git config --global user.name "fivetran-data-model-bot"
          git config --global user.email "fivetran-data-model-bot@users.noreply.github.com"
          git add .changes/TODO.yml.template
          git commit -m "Add .changes/*.yml template" || echo "No changes to commit"
          git push origin "$BRANCH_NAME"
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}

  check-docs:
    if: github.event.action != 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether docs, CHANGELOG.md, and the changelog entry are current
        id: check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # We don't need fresh docs/changelog if only these files were updated
          IRRELEVANT='\.md$|^\.quickstart/|^images/|^integration_tests/|^\.github/|^docs/'

          # Relevant changes made since the most recent commit (within this PR)
          # that touched $1. Empty result means that thing is current; a
          # non-empty result means something relevant changed after it was
          # last updated (or it was never updated at all in this PR).
          relevant_since_last_touch() {
            local path_filter="$1"
            local last
            last=$(git log --format=%H "$BASE..$HEAD" -- "$path_filter" | head -1)

            local changed
            if [[ -z "$last" ]]; then
              changed=$(git log --format= --name-only "$BASE..$HEAD" | sort -u | grep -v '^$' || true)
            else
              changed=$(git log --format= --name-only "$last..$HEAD" | sort -u | grep -v '^$' || true)
            fi

            echo "$changed" | grep -vE "$IRRELEVANT" || true
          }

          RELEVANT_DOCS=$(relevant_since_last_touch 'docs/')
          RELEVANT_CHANGELOG=$(relevant_since_last_touch 'CHANGELOG.md')
          RELEVANT_CHANGES_YML=$(relevant_since_last_touch '.changes/')

          echo "BASE: $BASE"
          echo "HEAD: $HEAD"
          echo "--- relevant changes since docs/ last touched ---"
          echo "$RELEVANT_DOCS"
          echo "--- relevant changes since CHANGELOG.md last touched ---"
          echo "$RELEVANT_CHANGELOG"
          echo "--- relevant changes since .changes/ last touched ---"
          echo "$RELEVANT_CHANGES_YML"

          MISSING=()
          [[ -n "$RELEVANT_DOCS" ]] && MISSING+=("docs regeneration")
          [[ -n "$RELEVANT_CHANGELOG" ]] && MISSING+=("CHANGELOG.md update")
          [[ -n "$RELEVANT_CHANGES_YML" ]] && MISSING+=("a .changes/*.yml entry")

          if [[ ${#MISSING[@]} -eq 0 ]]; then
            echo "state=success" >> $GITHUB_OUTPUT
            echo "desc=Docs and changelog current" >> $GITHUB_OUTPUT
            echo "target_url=" >> $GITHUB_OUTPUT
          else
            JOINED=$(printf '%s, ' "${MISSING[@]}")
            JOINED=${JOINED%, }
            echo "state=failure" >> $GITHUB_OUTPUT
            echo "desc=Missing: $JOINED - apply docs:ready" >> $GITHUB_OUTPUT

            # Point the status link at a copy-paste-ready template when a
            # .changes/*.yml entry is specifically what's missing.
            if [[ -n "$RELEVANT_CHANGES_YML" ]]; then
              echo "target_url=https://github.com/fivetran/dbt_package_automations/blob/main/templates/changes-template.yml" >> $GITHUB_OUTPUT
            else
              echo "target_url=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Remove docs:ready label if anything is stale or missing
        if: steps.check.outputs.state == 'failure'
        run: |
          curl -s -o /dev/null -X DELETE \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/docs:ready"

      - name: Report status
        run: |
          PAYLOAD=$(jq -n \
            --arg state "${{ steps.check.outputs.state }}" \
            --arg description "${{ steps.check.outputs.desc }}" \
            --arg target_url "${{ steps.check.outputs.target_url }}" \
            '{state: $state, context: "docs/generated", description: $description}
              + (if $target_url != "" then {target_url: $target_url} else {} end)')

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -d "$PAYLOAD")

          echo "Posted state: ${{ steps.check.outputs.state }}"
          echo "$RESPONSE" | jq -r '"API returned: \(.state) at \(.created_at)"'
