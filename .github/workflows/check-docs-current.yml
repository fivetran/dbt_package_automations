name: Check docs current

on:
  workflow_call:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether docs are current and a changelog entry is present
        id: check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # We don't need fresh docs/changelog if only these files were updated
          IRRELEVANT='\.md$|^\.quickstart/|^images/|^integration_tests/|^\.github/|^docs/'

          # Relevant changes made since the most recent commit (within this PR)
          # that touched $1. Empty result means that thing is current; a
          # non-empty result means something relevant changed after it was
          # last updated (or it was never updated at all in this PR).
          relevant_since_last_touch() {
            local path_filter="$1"
            local last
            last=$(git log --format=%H "$BASE..$HEAD" -- "$path_filter" | head -1)

            # "^$BASE" excludes base-branch-only history pulled in by a later merge of base into this PR branch.
            local changed
            if [[ -z "$last" ]]; then
              changed=$(git log --format= --name-only "$BASE..$HEAD" | sort -u | grep -v '^$' || true)
            else
              changed=$(git log --format= --name-only "$last..$HEAD" "^$BASE" | sort -u | grep -v '^$' || true)
            fi

            echo "$changed" | grep -vE "$IRRELEVANT" || true
          }

          # generate-docs.yml rebuilds docs and CHANGELOG.md in the same job, so
          # current docs also mean CHANGELOG.md was re-rendered. .changes/ edits
          # count as relevant here, so editing an entry forces a re-run too.
          RELEVANT_DOCS=$(relevant_since_last_touch 'docs/')

          # The PR only needs to include an entry somewhere, not re-touch it after every later change.
          RELEVANT_IN_PR=$(git diff --name-only "$BASE...$HEAD" | grep -vE "$IRRELEVANT" | grep -v '^\.changes/' || true)
          CHANGES_YML_IN_PR=$(git diff --name-only "$BASE...$HEAD" -- '.changes/*.yml')
          MISSING_ENTRY=""
          [[ -n "$RELEVANT_IN_PR" && -z "$CHANGES_YML_IN_PR" ]] && MISSING_ENTRY=1

          echo "BASE: $BASE"
          echo "HEAD: $HEAD"
          echo "--- relevant changes since docs/ last touched ---"
          echo "$RELEVANT_DOCS"
          echo "--- relevant changes in this PR ---"
          echo "$RELEVANT_IN_PR"
          echo "--- .changes/*.yml entries in this PR ---"
          echo "$CHANGES_YML_IN_PR"

          # Same fix either way (docs:ready), but name what actually went stale.
          STALE_CHANGES=$(echo "$RELEVANT_DOCS" | grep '^\.changes/' || true)
          STALE_OTHER=$(echo "$RELEVANT_DOCS" | grep -v '^\.changes/' | grep -v '^$' || true)

          MISSING=()
          [[ -n "$STALE_OTHER" ]] && MISSING+=("docs regeneration")
          [[ -n "$STALE_CHANGES" ]] && MISSING+=("CHANGELOG.md regeneration")
          [[ -n "$MISSING_ENTRY" ]] && MISSING+=("a .changes/*.yml entry")

          if [[ ${#MISSING[@]} -eq 0 ]]; then
            echo "state=success" >> $GITHUB_OUTPUT
            echo "desc=Docs and changelog current" >> $GITHUB_OUTPUT
            echo "target_url=" >> $GITHUB_OUTPUT
          else
            JOINED=$(printf '%s, ' "${MISSING[@]}")
            JOINED=${JOINED%, }
            if [[ -n "$MISSING_ENTRY" ]]; then
              ACTION="add the entry, then apply docs:ready"
            else
              ACTION="apply docs:ready"
            fi
            echo "state=failure" >> $GITHUB_OUTPUT
            echo "desc=Missing: $JOINED - $ACTION" >> $GITHUB_OUTPUT

            # Point the status link at a copy-paste-ready template when a
            # .changes/*.yml entry is specifically what's missing.
            if [[ -n "$MISSING_ENTRY" ]]; then
              echo "target_url=https://github.com/fivetran/dbt_package_automations/blob/main/templates/changes-template.yml" >> $GITHUB_OUTPUT
            else
              echo "target_url=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Remove docs:ready label if anything is stale or missing
        if: steps.check.outputs.state == 'failure'
        run: |
          curl -s -o /dev/null -X DELETE \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/docs:ready"

      - name: Report status
        run: |
          PAYLOAD=$(jq -n \
            --arg state "${{ steps.check.outputs.state }}" \
            --arg description "${{ steps.check.outputs.desc }}" \
            --arg target_url "${{ steps.check.outputs.target_url }}" \
            '{state: $state, context: "docs/generated", description: $description}
              + (if $target_url != "" then {target_url: $target_url} else {} end)')

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -d "$PAYLOAD")

          echo "Posted state: ${{ steps.check.outputs.state }}"
          echo "$RESPONSE" | jq -r '"API returned: \(.state) at \(.created_at)"'
