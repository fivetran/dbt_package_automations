# Example caller workflow for a downstream ("runner") dbt package repo.
# Drop this in that repo as .github/workflows/update-changelog.yml.
#
# Mirrors the existing generate-docs.yml / auto-release.yml caller pattern:
# https://github.com/fivetran/dbt_package_automations
name: 'update changelog'
on:
  pull_request:
    types:
      - labeled

jobs:
  update-changelog:
    if: github.event.label.name == 'docs:ready'
    uses: fivetran/dbt_package_automations/.github/workflows/update-changelog.yml@changelog-poc/initial-test
    secrets: inherit
