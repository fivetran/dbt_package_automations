        patch: |
          @@ -15,5 +15,6 @@
               {"name": "budget_type", "datatype": dbt.type_string()},
          -    {"name": "effective_budget", "datatype": dbt.type_float()}
          +    {"name": "effective_budget", "datatype": dbt.type_float()},
