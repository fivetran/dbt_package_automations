  - id: project-new-var-default-off
    impact: additive
    title: Add an option to exclude archived campaigns
    body: |
      Adds amazon_ads__exclude_archived_campaigns. It defaults to false, so nothing changes
      unless you turn it on. When on, the campaign report skips archived campaigns. I also
      documented it in the README. Tested on Snowflake with the variable on and off.
    # New opt-in logic (a filter) deserves a maintainer's eye, so never ready_to_go
    allow: [minor_revisions, human_review]
    files:
      - path: dbt_project.yml
        patch: |
          @@ -30,3 +30,4 @@ vars:
               amazon_ads__ad_group_passthrough_metrics: []
          +    amazon_ads__exclude_archived_campaigns: false
        text: |
          name: 'amazon_ads'
          vars:
            amazon_ads:
              amazon_ads__ad_group_passthrough_metrics: []
              amazon_ads__exclude_archived_campaigns: false
      - path: models/amazon_ads__campaign_report.sql
        patch: |
          @@ -18,6 +18,9 @@ campaigns as (
               select *
               from {{ ref('stg_amazon_ads__campaign_history') }}
               where is_most_recent_record = True
          +    {% if var('amazon_ads__exclude_archived_campaigns', false) %}
          +    and state != 'archived'
          +    {% endif %}
           ),
        text: |
          campaigns as (
              select *
              from {{ ref('stg_amazon_ads__campaign_history') }}
              where is_most_recent_record = True
              {% if var('amazon_ads__exclude_archived_campaigns', false) %}
              and state != 'archived'
              {% endif %}
          ),
      - path: README.md
        patch: |
          @@ -60,2 +60,8 @@
           ## (Optional) Step 5: Additional configurations
          +### Exclude archived campaigns
          +By default, the campaign report includes archived campaigns. To leave them out, add this to your `dbt_project.yml`:
          +```yml
          +vars:
          +  amazon_ads__exclude_archived_campaigns: true
          +```
        text: |
          ## (Optional) Step 5: Additional configurations
          ### Exclude archived campaigns
          By default, the campaign report includes archived campaigns. To leave them out, add this to your `dbt_project.yml`:
          ```yml
          vars:
            amazon_ads__exclude_archived_campaigns: true
          ```

