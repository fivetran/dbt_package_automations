# Test cases for the agent triage verdict.
#
# Each case is a mock PR, organized by customer impact. `allow` lists the verdicts that
# count as a pass. `gate: true` means the script must skip Claude entirely.
#
# Scoring (see run_evals.py):
#   wrong approval = got ready_to_go when `allow` doesn't include it. Must be zero.
#   missed approval = a case that should be ready_to_go got something else.
#
# Files are trimmed to the relevant part. `text` is the file after the change.

# Stand-in for the base branch file list that the real run sends to Claude
repo_paths:
  - README.md
  - macros/staging/get_ad_group_history_columns.sql
  - macros/staging/get_campaign_history_columns.sql
  - models/amazon_ads.yml
  - models/amazon_ads__campaign_report.sql
  - models/staging/src_amazon_ads.yml
  - models/staging/stg_amazon_ads.yml
  - models/staging/stg_amazon_ads__ad_group_history.sql
  - models/staging/stg_amazon_ads__campaign_history.sql
  - integration_tests/seeds/ad_group_history_data.csv
  - integration_tests/seeds/campaign_history_data.csv

cases:

  # --- No customer impact: the bot should approve -------------------------------------

  - id: none-yml-typo
    impact: none
    title: Fix typo in ad group description
    body: Fixes a spelling mistake in the staging docs.
    allow: [ready_to_go]
    files:
      - path: models/staging/stg_amazon_ads.yml
        patch: |
          @@ -3,7 +3,7 @@ version: 2
           models:
             - name: stg_amazon_ads__ad_group_history
          -    description: Each record represents an ad groupp in Amazon Ads.
          +    description: Each record represents an ad group in Amazon Ads.
               columns:
        text: |
          version: 2
          models:
            - name: stg_amazon_ads__ad_group_history
              description: Each record represents an ad group in Amazon Ads.
              columns:
                - name: ad_group_id
                  description: "{{ doc('ad_group_id') }}"

  - id: none-readme-wording
    impact: none
    title: Clarify README install step
    body: The install section was confusing, so I reworded it.
    allow: [ready_to_go]
    files:
      - path: README.md
        patch: |
          @@ -40,3 +40,3 @@
           ## Step 2: Install the package
          -Include the following amazon_ads package version in your `packages.yml` file if you are not using the upstream Ad Reporting package.
          +If you do not use the Ad Reporting package, add the following version of the amazon_ads package to your `packages.yml` file.
        text: |
          ## Step 2: Install the package
          If you do not use the Ad Reporting package, add the following version of the amazon_ads package to your `packages.yml` file.

  - id: none-sql-comment
    impact: none
    title: Add a comment explaining the most-recent-record flag
    body: Adds a comment so the window function is easier to understand.
    allow: [ready_to_go]
    files:
      - path: models/staging/stg_amazon_ads__campaign_history.sql
        patch: |
          @@ -35,5 +35,6 @@ final as (
                   budget_type,
                   effective_budget,
          +        -- Flags the latest version of each campaign
                   row_number() over (partition by id order by last_updated_date desc) = 1 as is_most_recent_record
               from fields
        text: |
          final as (
              select
                  budget_type,
                  effective_budget,
                  -- Flags the latest version of each campaign
                  row_number() over (partition by id order by last_updated_date desc) = 1 as is_most_recent_record
              from fields
          )
          select * from final

  # --- No output change: the bot should approve ---------------------------------------

  - id: noout-cross-db-type
    impact: no_output_change
    title: Use dbt.type_string() instead of hardcoded varchar
    body: Swaps a hardcoded type for the cross-database macro so it works on every warehouse.
    allow: [ready_to_go, minor_revisions]
    files:
      - path: models/staging/stg_amazon_ads__campaign_history.sql
        patch: |
          @@ -22,7 +22,7 @@ final as (
               select
                   source_relation,
          -        cast(id as varchar) as campaign_id,
          +        cast(id as {{ dbt.type_string() }}) as campaign_id,
                   last_updated_date,
        text: |
          final as (
              select
                  source_relation,
                  cast(id as {{ dbt.type_string() }}) as campaign_id,
                  last_updated_date
              from fields
          )
          select * from final

  # --- Additive and opt-in: approve, or ask for small fixes ---------------------------

