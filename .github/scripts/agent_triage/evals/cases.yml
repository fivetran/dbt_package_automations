  - id: out-metric-logic
    impact: output_change
    title: Fix cost being reported in cents
    body: Cost is in cents, so this divides by 100.
    allow: [human_review]
    files:
      - path: models/amazon_ads__campaign_report.sql
        patch: |
          @@ -40,7 +40,7 @@ fields as (
