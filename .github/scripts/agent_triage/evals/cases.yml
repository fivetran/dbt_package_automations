  # --- Changes customer output: always a maintainer -----------------------------------

  - id: out-join-type
    impact: output_change
    title: Use inner join for campaigns
    body: Cleans up the joins.
    allow: [human_review]
    files:
      - path: models/amazon_ads__campaign_report.sql
        patch: |
          @@ -48,7 +48,7 @@ fields as (
               from report
          -    left join campaigns
          +    inner join campaigns
                   on campaigns.campaign_id = report.campaign_id
                   and campaigns.source_relation = report.source_relation
        text: |
          fields as (
              select report.date_day, campaigns.campaign_name, sum(report.cost) as cost
              from report
              inner join campaigns
                  on campaigns.campaign_id = report.campaign_id
                  and campaigns.source_relation = report.source_relation
              group by 1, 2
          )
          select * from fields

