          ] %}
          {{ return(columns) }}
          {% endmacro %}
      - path: models/staging/stg_amazon_ads__campaign_history.sql
        patch: |
          @@ -36,4 +36,5 @@ final as (
                   budget_type,
                   effective_budget,
          +        rule_based_budget,
                   row_number() over (partition by id order by last_updated_date desc) = 1 as is_most_recent_record
        text: |
          final as (
              select
                  budget_type,
                  effective_budget,
                  rule_based_budget,
                  row_number() over (partition by id order by last_updated_date desc) = 1 as is_most_recent_record
              from fields
          )
          select * from final
      - path: models/staging/stg_amazon_ads.yml
        patch: |
          @@ -80,3 +80,5 @@
                 - name: effective_budget
                   description: "{{ doc('effective_budget') }}"
          +      - name: rule_based_budget
          +        description: The budget amount set by a rule-based budget, if one applies.
        text: |
                - name: effective_budget
