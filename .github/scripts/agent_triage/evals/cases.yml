    impact: additive
    title: Add rule_based_budget to campaign history
    body: |
      Adds the rule_based_budget field that Fivetran now syncs. I added it to the
      columns macro, the staging model, and the docs. Tested on Snowflake.
    allow: [ready_to_go, minor_revisions]
